name: Keep MongoDB Atlas Alive

on:
  # Runs every 3 days at 8:00 AM UTC — well within the 30-day window
  schedule:
    - cron: '0 8 */3 * *'

  # Also lets you trigger it manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install mongoose
        run: npm install mongoose dotenv

      - name: Ping MongoDB Atlas
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: node scripts/ping-mongo.js
